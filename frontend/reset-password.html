<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password reset | VASTRA</title><link rel="stylesheet" href="css/style.css?v=vastra-cartfix-20261101-v5"></head><body class="auth-body"><main class="auth-page"><section class="auth-showcase"><a class="logo" href="index.html">VASTRA</a><h1>Account <span>recovery</span></h1><p>Reset your password securely.</p></section><section class="auth-box"><h2>Forgot password</h2><p>Enter your account email to request a reset token.</p><form id="forgotForm"><label>Email<input id="forgotEmail" type="email" required autocomplete="email"></label><button class="btn auth-submit" type="submit">Request reset</button><p id="forgotMessage" class="form-message"></p></form><hr><h2>Set a new password</h2><form id="resetForm"><label>Reset token<input id="resetToken" required autocomplete="one-time-code"></label><label>New password<input id="resetPassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn auth-submit" type="submit">Update password</button><p id="resetMessage" class="form-message"></p></form><p><a href="login.html">Back to login</a></p></section></main><script src="js/script.js?v=vastra-cartfix-20261101-v5"></script></body></html>

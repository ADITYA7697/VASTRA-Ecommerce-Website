<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Support | VASTRA</title>

    <link rel="stylesheet"
          href="css/style.css?v=vastra-cartfix-20261101-v5">

</head>

<body>

<header class="header">

    <a href="index.html"
       class="logo">
        VASTRA
    </a>

    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Shop
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="profile.html">
            Account
        </a>

    </nav>

</header>


<main class="support-page">

    <div class="support-intro">

        <p>
            WE ARE HERE FOR YOU
        </p>

        <h1>
            How can we help?
        </h1>

        <p>
            Send us your problem and our support
            team will get back to you.
        </p>

    </div>


    <form
        id="supportForm"
        class="support-form">

        <input
            type="text"
            id="supportName"
            placeholder="Your name"
            required
        >


        <input
            type="email"
            id="supportEmail"
            placeholder="Your email"
            required
        >


        <select id="supportTopic">

            <option>
                Order Problem
            </option>

            <option>
                Payment Problem
            </option>

            <option>
                Delivery Problem
            </option>

            <option>
                Return / Refund
            </option>

            <option>
                Other
            </option>

        </select>


        <textarea
            id="supportMessage"
            rows="6"
            placeholder="Tell us about your problem..."
            required>
        </textarea>


        <button
            type="submit"
            class="btn">

            Send Message

        </button>


        <p id="supportResponse"></p>

    </form>

</main>


<script src="js/script.js?v=vastra-api-origin-fix-v7"></script>
</body>
</html>
